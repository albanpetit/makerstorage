name: Deploy to Production

# Continuous delivery: a production deploy runs when a SemVer tag (vX.Y.Z) is
# pushed — see CONTRIBUTING.md "Releases & versioning". Tags are cut from main
# once CI is green, so main stays releasable and shipping stays deliberate.
# workflow_dispatch allows a manual re-deploy of the current ref.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_tests_check:
        description: "Deploy even if the Tests workflow hasn't passed on this commit (emergencies only)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  # A tag is cut from main once CI is green: check it really was, so a tag on
  # a red (or untested) commit never reaches production.
  tests-passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a successful Tests run on this commit
        if: ${{ !inputs.skip_tests_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          count=$(gh api "repos/$REPO/actions/workflows/test.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')
          if [ "$count" -lt 1 ]; then
            echo "::error::No successful Tests run for $SHA. Wait for CI on main (or re-run it) before tagging."
            exit 1
          fi

  deploy:
    needs: tests-passed
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      # The image is multi-arch (amd64 + arm64, see builder.arch in config/deploy.yml);
      # register QEMU/binfmt handlers so this amd64 runner can build the arm64 half.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: ${{ vars.CLOUDFLARED_VERSION }}
          CLOUDFLARED_SHA256: ${{ vars.CLOUDFLARED_SHA256 }}
        run: bin/ci-install-cloudflared

      # SSH to the server runs through a Cloudflare Tunnel (Kamal's ssh.proxy_command
      # in config/deploy.yml invokes cloudflared). Write the deploy key so Kamal's
      # net-ssh can authenticate, and the server's host key (SSH_KNOWN_HOSTS) so
      # it is checked.
      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: bin/ci-ssh-config

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: albanpetit
          # A PAT with write:packages — the automatic GITHUB_TOKEN is denied by ghcr
          # for user-namespace packages.
          password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}

      - name: Deploy with Kamal
        run: bundle exec kamal deploy
        env:
          # Registry auth + app secrets, read by .kamal/secrets.
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # Server + proxy targets, read by config/deploy.yml.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_HOST: ${{ secrets.APP_HOST }}
          # Outgoing mail, read by config/deploy.yml (SMTP_PASSWORD via .kamal/secrets).
          # Unset ones arrive as "" and fall back to app defaults.
          MAILER_SENDER: ${{ secrets.MAILER_SENDER }}
          SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_DOMAIN: ${{ secrets.SMTP_DOMAIN }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
