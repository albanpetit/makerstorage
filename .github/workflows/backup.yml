name: Backup

# Nightly backup of the production volume (all SQLite databases + Active Storage
# uploads). This workflow is only a *trigger*: it SSHes to the server over the
# Cloudflare Tunnel and runs bin/backup-storage inside the running container, which
# writes a rotated, compressed archive to the host directory /srv/apps/makerstorage
# (bind-mounted at /rails/backups). Nothing is uploaded to GitHub — the customer
# data never leaves the server. Can also be run on demand from the Actions tab.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install -y cloudflared

      - name: Set up SSH through the Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            "Host ${{ secrets.DEPLOY_HOST }}" \
            "  User ${{ secrets.DEPLOY_USER }}" \
            "  IdentityFile ~/.ssh/id_ed25519" \
            "  ProxyCommand cloudflared access ssh --hostname %h" \
            "  StrictHostKeyChecking no" \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Run backup on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" '
            set -e
            cid=$(docker ps -q \
              -f label=com.docker.compose.project=makerstorage \
              -f label=com.docker.compose.service=web | head -1)
            if [ -z "$cid" ]; then echo "no running makerstorage container" >&2; exit 1; fi
            # Writes makerstorage-<UTC>.tar.gz to /rails/backups (host: /srv/apps/makerstorage),
            # keeping the newest 7. The archive stays on the server.
            docker exec "$cid" bash /rails/bin/backup-storage --out /rails/backups
            echo "--- backups currently on the server (/srv/apps/makerstorage) ---"
            docker exec "$cid" ls -lh /rails/backups
          '
