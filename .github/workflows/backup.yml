name: Backup

# Nightly backup of the production volume (all SQLite databases + Active Storage
# uploads). This workflow is only a *trigger*: it SSHes to the server over the
# Cloudflare Tunnel and runs bin/backup-storage inside the running container, which
# writes a rotated, compressed archive to the host directory /srv/apps/makerstorage
# (bind-mounted at /rails/backups). Nothing is uploaded to GitHub — the customer
# data never leaves the server. Can also be run on demand from the Actions tab.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

# Only the repository's scripts are needed: no write access.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # bin/ci-install-cloudflared and bin/ci-ssh-config.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: ${{ vars.CLOUDFLARED_VERSION }}
          CLOUDFLARED_SHA256: ${{ vars.CLOUDFLARED_SHA256 }}
        run: bin/ci-install-cloudflared

      - name: Set up SSH through the Cloudflare Tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: bin/ci-ssh-config --proxy

      - name: Run backup on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" '
            set -e
            cid=$(docker ps -q \
              -f label=com.docker.compose.project=makerstorage \
              -f label=com.docker.compose.service=web | head -1)
            if [ -z "$cid" ]; then echo "no running makerstorage container" >&2; exit 1; fi
            # Writes makerstorage-<UTC>.tar.gz to /rails/backups (host: /srv/apps/makerstorage),
            # keeping the newest 7. The archive stays on the server.
            docker exec "$cid" bash /rails/bin/backup-storage --out /rails/backups
            echo "--- backups currently on the server (/srv/apps/makerstorage) ---"
            docker exec "$cid" ls -lh /rails/backups
          '

      # Off-site copy: the archives above sit on the server's own disk, so a
      # lost disk or server takes them too. With BACKUP_OFFSITE_REMOTE set (an
      # rclone remote, e.g. "b2crypt:makerstorage" — make it a crypt remote so
      # the copy is encrypted), the server uploads the new archive itself: the
      # data never passes through GitHub. rclone must be installed and
      # configured on the server (see CONTRIBUTING.md, "Backups").
      - name: Copy the new archive off the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          BACKUP_OFFSITE_REMOTE: ${{ secrets.BACKUP_OFFSITE_REMOTE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_OFFSITE_REMOTE" ]; then
            echo "::warning::No off-site copy: set the BACKUP_OFFSITE_REMOTE secret (an rclone remote on the server)."
            exit 0
          fi
          latest=$(ssh "$DEPLOY_HOST" 'ls -1t /srv/apps/makerstorage/makerstorage-*.tar.gz | head -1')
          ssh "$DEPLOY_HOST" "rclone copy --no-traverse $(printf '%q' "$latest") $(printf '%q' "$BACKUP_OFFSITE_REMOTE")"
          echo "Copied $(basename "$latest") to the off-site remote."
