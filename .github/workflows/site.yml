name: Site

# Build the marketing site in site/ and publish it to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions". Pages needs a public repo
# on the free plan, so publishing is skipped (build only) while it is private.
on:
  push:
    branches: [ main ]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress deploy finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Provides the real origin and base path (they change with a custom domain).
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
