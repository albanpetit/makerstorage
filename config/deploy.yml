# Kamal 2.x deployment configuration for Makerstorage.
# Deploys to the production Docker server over a Cloudflare Tunnel (same host that
# runs PaperFlux). Documentation: https://kamal-deploy.org

# Name of your application. Used to uniquely configure containers.
service: makerstorage

# Name of the container image (ghcr.io/albanpetit/makerstorage).
image: albanpetit/makerstorage

# Deploy to these servers. The host is injected from the deploy workflow / local
# ENV so the private address never lands in git.
servers:
  web:
    hosts:
      - <%= ENV["DEPLOY_HOST"] || "localhost" %>

# Where you keep your container images.
registry:
  server: ghcr.io
  username: albanpetit
  # ghcr.io authenticates with a GitHub token (GITHUB_TOKEN in CI, a PAT locally).
  password:
    - GITHUB_TOKEN

# Kamal proxy. SSL is terminated by the Cloudflare Tunnel in front of the server,
# so the proxy itself serves plain HTTP (ssl: false). Thruster listens on port 80
# inside the container and Rails exposes its health check on /up.
proxy:
  ssl: false
  host: <%= ENV["APP_HOST"] || "localhost" %>
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

# Group this app's containers under a single Portainer "stack". Portainer treats
# any containers sharing a com.docker.compose.project label as one (external)
# stack, so the Kamal-run web container shows up nested instead of loose.
labels:
  com.docker.compose.project: makerstorage
  com.docker.compose.service: web

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# SSH to the server through the Cloudflare Tunnel (cloudflared must be installed
# on the machine running Kamal — the deploy workflow installs it).
ssh:
  user: <%= ENV["DEPLOY_USER"] || "deploy" %>
  proxy_command: "cloudflared access ssh --hostname %h"

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "makerstorage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder. The production server is arm64 (same host as
# PaperFlux), so build for arm64.
builder:
  arch: arm64

# Keep the last few images/containers on the server for quick rollbacks.
retain_containers: 5

# Cap container log size so a chatty app can't fill the disk.
logging:
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
