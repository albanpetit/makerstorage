#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purge_unattached_blobs:
    class: PurgeUnattachedBlobsJob
    schedule: every day at 4am
  purge_stale_oauth:
    class: PurgeStaleOauthJob
    schedule: every day at 4:30am
  purge_personal_data:
    class: PurgePersonalDataJob
    schedule: every day at 4:45am
  # Hourly so each organization gets its digest at 8am in its own time zone.
  send_notification_digests:
    class: NotificationDigestJob
    schedule: every hour at minute 5
